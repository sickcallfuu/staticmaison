{{define "main"}}

<!--Date-->
{{ $date := .Date.Format "2006-01-02" }}
{{ $lastmod := .Lastmod.Format "2006-01-02" }}
<ul>
    <li>{{ $date }} {{ if ne $lastmod $date }}</li>
    <ul>
        <li> → last update {{ .Lastmod.Format "2006-01-02" }} {{ end }}</li>
    </ul>
</ul>
<p>{{ .Description }}</p>

<!--Content-->
{{.Content}}

{{end}}
